# LLM Wiki configuration. Edit freely: every research run reads this file.

title: My Wiki
description: A personal research wiki. Every claim links back to its source.

# Collections are top-level folders in wiki/. Each one has its own sources and page shape.
# `wiki research "topic" -c <collection>` picks one; without -c the default is used.
default_collection: general

collections:
  general:
    description: Anything that doesn't fit elsewhere.
    # Domains to prefer when searching. Empty means the whole web.
    prefer_domains: []
    # Domains never to cite.
    avoid_domains: [pinterest.com, quora.com]
    # Sections every page in this collection should have, in order.
    sections:
      - Summary
      - Key ideas
      - How it works
      - Open questions
      - Disagreements

  tech:
    description: Software, infrastructure and tools I use or evaluate.
    prefer_domains: [github.com, kubernetes.io, cncf.io, docs.python.org, developer.mozilla.org]
    # YouTube channels whose talks are good sources (matched against the video's channel name).
    youtube_channels: [CNCF, Google Cloud Tech, GOTO Conferences, InfoQ]
    avoid_domains: [medium.com]
    sections:
      - What it is
      - How it works
      - When to use it vs alternatives
      - Real-world usage
      - Gotchas
      - Disagreements

  papers:
    description: Research papers and the talks explaining them.
    prefer_domains: [arxiv.org, openreview.net, aclanthology.org, proceedings.neurips.cc]
    sections:
      - TL;DR
      - Problem
      - Method
      - Results
      - Limitations
      - Related work

# The YouTube channel the wiki is built from. Each playlist on it is one point on the timeline (an event,
# a season, a year); each video is a talk: a technical concept, a case study, a tutorial, ...
#
#   wiki sync        lists every playlist and video, fetches full transcripts, builds the indexes
#   wiki classify    labels each video (case study / concept / ...) with its organizations and topics
#   wiki find TOPIC  every case study on TOPIC across all playlists, oldest first
channel:
  url: https://www.youtube.com/@cncf
  collection: tech              # wiki.yaml collection that pages built from it belong to
  languages: [en, en-US, en-GB] # caption languages to try, in order
  playlists:
    # Keep only playlists whose title contains one of these words (empty = all playlists).
    include: [KubeCon, CloudNativeCon]
    # Drop playlists whose title contains one of these words.
    exclude: [Shorts, Livestream, Webinar]
    # Or list exactly which playlists to use (ids or URLs); this overrides include/exclude.
    only: []
    # The timeline date is read from each playlist's title ("... Europe 2024" -> 2024). Fix or add one here:
    timeline: {}
    #   PLj6h78yzYM2xxxxxxxxxxxxxxxxxxxx: 2024-03
  videos:
    exclude: [Keynote, Opening Remarks, Closing Remarks]

# Research run settings
research:
  max_sources: 8          # sources to ingest per topic
  prefer_recent_years: 3  # favor material from the last N years
  timeout_minutes: 20
  # false: pages are built only from the synced channel and memory (the default when `channel:` is set).
  # true: the agent may also use web search. Override per run with --web / --no-search.
  web_search: false
  # Write a browsable transcript page per video under wiki/sources/videos/ (set false if you publish the site
  # publicly and don't want to republish full transcripts).
  transcript_pages: true
