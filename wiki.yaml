# LLM Wiki configuration. Edit freely: every research run reads this file.

title: My Wiki
description: A personal research wiki. Every claim links back to its source.

# Collections are top-level folders in wiki/. Each one has its own sources and page shape.
# `wiki research "topic" -c <collection>` picks one; without -c the default is used.
default_collection: general

collections:
  general:
    description: Anything that doesn't fit elsewhere.
    # Domains to prefer when searching. Empty means the whole web.
    prefer_domains: []
    # Domains never to cite.
    avoid_domains: [pinterest.com, quora.com]
    # Sections every page in this collection should have, in order.
    sections:
      - Summary
      - Key ideas
      - How it works
      - Open questions
      - Disagreements

  tech:
    description: Software, infrastructure and tools I use or evaluate.
    prefer_domains: [github.com, kubernetes.io, cncf.io, docs.python.org, developer.mozilla.org]
    # YouTube channels whose talks are good sources (matched against the video's channel name).
    youtube_channels: [CNCF, Google Cloud Tech, GOTO Conferences, InfoQ]
    avoid_domains: [medium.com]
    sections:
      - What it is
      - How it works
      - When to use it vs alternatives
      - Real-world usage
      - Gotchas
      - Disagreements

  papers:
    description: Research papers and the talks explaining them.
    prefer_domains: [arxiv.org, openreview.net, aclanthology.org, proceedings.neurips.cc]
    sections:
      - TL;DR
      - Problem
      - Method
      - Results
      - Limitations
      - Related work

# The YouTube channel the wiki is built from. Each playlist on it is one point on the timeline (an event,
# a season, a year); each video is a talk: a technical concept, a case study, a tutorial, ...
#
#   wiki sync        lists every playlist and video, fetches full transcripts, builds the indexes
#   wiki classify    labels each video (case study / concept / ...) with its organizations and topics
#   wiki find TOPIC  every case study on TOPIC across all playlists, oldest first
channel:
  url: https://www.youtube.com/@cncf
  collection: tech              # wiki.yaml collection that pages built from it belong to
  languages: [en, en-US, en-GB] # caption languages to try, in order
  playlists:
    # Keep only playlists whose title contains one of these words (empty = all playlists).
    include: [KubeCon, CloudNativeCon]
    # Drop playlists whose title contains one of these words.
    exclude: [Shorts, Livestream, Webinar]
    # Or list exactly which playlists to use (ids or URLs); this overrides include/exclude.
    only: []
    # The timeline date is read from each playlist's title ("... Europe 2024" -> 2024). Fix or add one here:
    timeline: {}
    #   PLj6h78yzYM2xxxxxxxxxxxxxxxxxxxx: 2024-03
  videos:
    exclude: [Keynote, Opening Remarks, Closing Remarks]

# Categories: broad themes that cut across every playlist. A video belongs to a category when a keyword
# appears in its title, its Claude topics or summary, or at least `min_mentions` times in its transcript.
# Each category gets a page (wiki/categories/<name>.md) with every talk on it, grouped by event over time.
# Add, rename or extend freely; pages are rebuilt on every run, no relabeling needed.
category_settings:
  min_mentions: 6     # transcript chunks mentioning a keyword...
  min_share: 0.2      # ...and at least this share of the video's chunks
categories:
  Observability: [observability, opentelemetry, otel, prometheus, grafana, jaeger, tracing, distributed tracing,
                  metrics, logging, logs, fluentd, fluent bit, loki, thanos, cortex, mimir, tempo, ebpf observability,
                  monitoring, alerting, slo, profiling, pixie]
  Security: [security, supply chain, sbom, sigstore, cosign, falco, opa, gatekeeper, kyverno, policy, rbac, spiffe,
             spire, zero trust, vulnerability, cve, secrets, vault, compliance, runtime security, admission control]
  Networking: [networking, cni, cilium, calico, service mesh, istio, linkerd, envoy, gateway api, ingress, dns,
               coredns, load balancing, network policy, ebpf, multi-cluster networking]
  Storage & data: [storage, csi, rook, ceph, persistent volume, stateful, database, postgres, etcd, vitess, tikv,
                   backup, velero, data on kubernetes]
  Autoscaling & performance: [autoscaling, autoscaler, hpa, vpa, keda, karpenter, cluster autoscaler, scaling,
                              performance, capacity planning, scheduling, scheduler]
  CI/CD & GitOps: [gitops, argo, argocd, argo cd, flux, ci/cd, continuous delivery, continuous deployment, tekton,
                   jenkins, helm, kustomize, progressive delivery, canary]
  Platform engineering: [platform engineering, internal developer platform, backstage, developer experience,
                         crossplane, self-service, golden path, multi-tenancy, multi-tenant]
  AI & ML: [machine learning, ml, ai, llm, gpu, kubeflow, inference, training, model serving, kserve, ray, mlops,
            ai agents, generative ai]
  Serverless & runtimes: [serverless, knative, faas, webassembly, wasm, containerd, cri-o,
                          kata containers, gvisor, firecracker]
  Cost & efficiency: [cost, finops, cost optimization, efficiency, spot instances, resource management, rightsizing,
                      sustainability]
  Reliability & operations: [reliability, sre, incident, outage, postmortem, chaos engineering, litmus, chaos mesh,
                             upgrade, day 2, disaster recovery, high availability]
  Edge & IoT: [edge, iot, kubeedge, k3s, akri, telco, 5g]

# Unattended updates: `wiki schedule` installs a daily task that runs `wiki auto`
# (sync new videos -> classify -> rebuild pages -> commit -> push). Or double-click update-wiki.cmd.
schedule:
  time: "02:00"            # daily, local time
  max_transcripts: 300     # per run; the rest are fetched on the next runs
  delay_seconds: 2         # between transcripts, to stay under YouTube's rate limit
  classify: claude         # claude | heuristic | off
  max_classify: 600        # videos labeled by Claude per run (30 per call)
  push: true               # git push after committing
  topic_pages: 25          # write a case-study timeline page for the 25 topics with the most case studies
  topics: []               # plus a page for each topic listed here, e.g. [autoscaling, multi-tenancy, gpu]

# Research run settings
research:
  max_sources: 8          # sources to ingest per topic
  prefer_recent_years: 3  # favor material from the last N years
  timeout_minutes: 20
  # false: pages are built only from the synced channel and memory (the default when `channel:` is set).
  # true: the agent may also use web search. Override per run with --web / --no-search.
  web_search: false
  # Write a browsable transcript page per video under wiki/sources/videos/ (set false if you publish the site
  # publicly and don't want to republish full transcripts).
  transcript_pages: true
