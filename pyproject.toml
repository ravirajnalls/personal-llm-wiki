[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "0.1.0"
description = "A personal research wiki where every claim links back to its source, written by Claude Code."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "youtube-transcript-api>=1.0",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
wiki = "llmwiki.cli:main"
wiki-mcp = "llmwiki.mcp_server:main"

[tool.setuptools]
packages = ["llmwiki"]
